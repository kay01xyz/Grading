<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DAE 生涯規劃｜中期報告評分與標籤工具（4A 文字 ＋ 4B 口頭）</title>
  <style>
    :root {
      --bg: #f4f6f8;
      --surface: #ffffff;
      --surface-soft: #f8fafc;
      --border: #e2e8f0;
      --border-strong: #cbd5e1;
      --ink: #1e293b;
      --ink-muted: #64748b;
      --ink-light: #94a3b8;
      --accent-4a: #0f766e;
      --accent-4a-bg: #f0fdfa;
      --accent-4a-border: #99f6e4;
      --accent-4b: #4338ca;
      --accent-4b-bg: #eef2ff;
      --accent-4b-border: #c7d2fe;
      --lv-high: #059669;
      --lv-high-bg: #ecfdf5;
      --lv-mid: #0284c7;
      --lv-mid-bg: #f0f9ff;
      --lv-low: #d97706;
      --lv-low-bg: #fffbeb;
      --lv-poor: #dc2626;
      --lv-poor-bg: #fef2f2;
      --tag-pos: #047857;
      --tag-pos-bg: #d1fae5;
      --tag-imp: #b45309;
      --tag-imp-bg: #fef3c7;
      --radius: 12px;
      --radius-sm: 8px;
      --shadow: 0 1px 3px rgba(15, 23, 42, 0.06), 0 1px 2px rgba(15, 23, 42, 0.04);
      --shadow-md: 0 6px 20px rgba(15, 23, 42, 0.08);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang HK", "Microsoft JhengHei", "Noto Sans TC", "Segoe UI", sans-serif;
      line-height: 1.5;
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;
    }

    button, input, textarea {
      font-family: inherit;
    }

    /* App Shell */
    .app-shell {
      display: flex;
      min-height: 100vh;
      width: 100%;
    }

    /* Sidebar */
    .sidebar {
      width: 280px;
      flex-shrink: 0;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      position: sticky;
      top: 0;
      height: 100vh;
      z-index: 30;
    }

    .sidebar-header {
      padding: 16px;
      border-bottom: 1px solid var(--border);
    }

    .brand-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--ink);
      margin: 0 0 2px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .brand-sub {
      font-size: 12px;
      color: var(--ink-muted);
      margin: 0;
    }

    .class-input-row {
      margin-top: 10px;
      display: flex;
      gap: 6px;
    }

    .class-input {
      flex: 1;
      min-width: 0;
      padding: 6px 10px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 13px;
      background: var(--surface-soft);
      color: var(--ink);
    }

    .class-input:focus {
      outline: 2px solid var(--accent-4a);
      border-color: transparent;
      background: #fff;
    }

    .sidebar-actions {
      padding: 10px 16px;
      display: flex;
      gap: 8px;
      border-bottom: 1px solid var(--border);
    }

    .search-box {
      padding: 8px 16px;
      border-bottom: 1px solid var(--border);
    }

    .search-box input {
      width: 100%;
      padding: 7px 10px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 13px;
      background: var(--surface-soft);
    }

    .roster-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }

    .student-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 12px;
      margin-bottom: 4px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      border: 1px solid transparent;
      transition: background 0.15s, border-color 0.15s;
    }

    .student-item:hover {
      background: var(--surface-soft);
    }

    .student-item.active {
      background: var(--accent-4a-bg);
      border-color: var(--accent-4a-border);
    }

    .student-item-left {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      flex: 1;
    }

    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      flex-shrink: 0;
      background: #cbd5e1;
    }
    .status-dot.partial { background: #f59e0b; }
    .status-dot.done { background: #10b981; }

    .student-item-name {
      font-size: 14px;
      font-weight: 600;
      color: var(--ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .student-item-score {
      font-size: 12px;
      font-weight: 700;
      color: var(--ink-muted);
      flex-shrink: 0;
      font-variant-numeric: tabular-nums;
    }

    .student-item.active .student-item-score {
      color: var(--accent-4a);
    }

    .sidebar-footer {
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      background: var(--surface-soft);
      font-size: 12px;
      color: var(--ink-muted);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* Main Content */
    .main-area {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    /* Sticky Top Bar */
    .top-bar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
      padding: 10px 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
    }

    .top-student-nav {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn.mobile-menu-btn {
      display: none;
    }

    .student-name-input {
      font-size: 17px;
      font-weight: 700;
      color: var(--ink);
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      padding: 4px 8px;
      background: transparent;
      min-width: 140px;
      max-width: 240px;
    }

    .student-name-input:hover {
      border-color: var(--border);
      background: var(--surface-soft);
    }

    .student-name-input:focus {
      outline: none;
      border-color: var(--accent-4a);
      background: #fff;
    }

    .score-summary-pills {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .score-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--ink);
      transition: transform 0.1s, box-shadow 0.15s;
      font-variant-numeric: tabular-nums;
    }

    .score-pill:hover {
      box-shadow: var(--shadow);
    }

    .score-pill.pill-4a {
      background: var(--accent-4a-bg);
      border-color: var(--accent-4a-border);
      color: var(--accent-4a);
    }

    .score-pill.pill-4b {
      background: var(--accent-4b-bg);
      border-color: var(--accent-4b-border);
      color: var(--accent-4b);
    }

    .score-pill.pill-total {
      background: #0f172a;
      border-color: #0f172a;
      color: #ffffff;
    }

    .toolbar-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 7px 12px;
      min-height: 36px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-strong);
      background: var(--surface);
      color: var(--ink);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
      white-space: nowrap;
    }

    .btn:hover {
      background: var(--surface-soft);
      border-color: #94a3b8;
    }

    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--accent-4a);
      border-color: var(--accent-4a);
      color: #fff;
    }

    .btn-primary:hover {
      background: #115e59;
      border-color: #115e59;
    }

    .btn-indigo {
      background: var(--accent-4b);
      border-color: var(--accent-4b);
      color: #fff;
    }

    .btn-indigo:hover {
      background: #3730a3;
      border-color: #3730a3;
    }

    .btn-danger-ghost {
      color: #dc2626;
      border-color: #fecaca;
      background: #fff;
    }

    .btn-danger-ghost:hover {
      background: #fef2f2;
    }

    .btn-sm {
      padding: 5px 10px;
      min-height: 32px;
      font-size: 12px;
    }

    /* Grading Container */
    .grading-container {
      max-width: 980px;
      width: 100%;
      margin: 0 auto;
      padding: 20px 20px 64px 20px;
    }

    .section-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      padding: 14px 18px;
      border-radius: var(--radius);
      margin: 8px 0 16px 0;
      scroll-margin-top: 84px;
    }

    .section-banner.banner-4a {
      background: linear-gradient(135deg, #0f766e, #0d9488);
      color: #fff;
    }

    .section-banner.banner-4b {
      background: linear-gradient(135deg, #3730a3, #4f46e5);
      color: #fff;
      margin-top: 32px;
    }

    .section-banner h2 {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
    }

    .section-banner-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      font-weight: 600;
    }

    .banner-badge {
      background: rgba(255, 255, 255, 0.2);
      padding: 4px 10px;
      border-radius: 999px;
      font-variant-numeric: tabular-nums;
    }

    /* Category Card */
    .cat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      margin-bottom: 16px;
      overflow: hidden;
    }

    .cat-header {
      padding: 12px 16px;
      background: var(--surface-soft);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }

    .cat-title-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .cat-title {
      font-size: 15px;
      font-weight: 700;
      margin: 0;
      color: var(--ink);
    }

    .cat-weight {
      font-size: 12px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 999px;
      background: #e2e8f0;
      color: #334155;
    }

    .cat-score-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .cat-raw-info {
      font-size: 12px;
      color: var(--ink-muted);
      font-variant-numeric: tabular-nums;
    }

    .adj-group {
      display: inline-flex;
      align-items: center;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm);
      overflow: hidden;
      background: #fff;
    }

    .adj-btn {
      border: none;
      background: transparent;
      padding: 4px 10px;
      min-height: 30px;
      font-size: 13px;
      font-weight: 700;
      color: var(--ink);
      cursor: pointer;
    }

    .adj-btn:hover {
      background: var(--surface-soft);
    }

    .adj-val {
      padding: 0 8px;
      font-size: 13px;
      font-weight: 700;
      color: var(--ink);
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
      min-width: 44px;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    .cat-weighted-badge {
      font-size: 13px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: var(--radius-sm);
      background: var(--accent-4a-bg);
      color: var(--accent-4a);
      font-variant-numeric: tabular-nums;
    }

    .cat-card.card-4b .cat-weighted-badge {
      background: var(--accent-4b-bg);
      color: var(--accent-4b);
    }

    /* Sub-items */
    .subitem-list {
      padding: 4px 16px;
    }

    .subitem-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px dashed var(--border);
      flex-wrap: wrap;
    }

    .subitem-row:last-child {
      border-bottom: none;
    }

    .subitem-info {
      flex: 1;
      min-width: 240px;
    }

    .subitem-name {
      font-size: 14px;
      font-weight: 600;
      color: var(--ink);
      margin: 0 0 3px 0;
    }

    .subitem-hint {
      font-size: 12px;
      color: var(--ink-muted);
      margin: 0;
    }

    .level-buttons {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    .lv-btn {
      min-width: 62px;
      min-height: 40px;
      padding: 6px 10px;
      border-radius: var(--radius-sm);
      border: 1.5px solid var(--border-strong);
      background: #fff;
      color: var(--ink-muted);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.12s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      line-height: 1.15;
    }

    .lv-btn small {
      font-size: 10px;
      font-weight: 600;
      opacity: 0.85;
    }

    .lv-btn:hover {
      border-color: #94a3b8;
      background: var(--surface-soft);
    }

    .lv-btn.active-high {
      background: var(--lv-high);
      border-color: var(--lv-high);
      color: #fff;
      box-shadow: 0 2px 6px rgba(5, 150, 105, 0.25);
    }

    .lv-btn.active-mid {
      background: var(--lv-mid);
      border-color: var(--lv-mid);
      color: #fff;
      box-shadow: 0 2px 6px rgba(2, 132, 199, 0.25);
    }

    .lv-btn.active-low {
      background: var(--lv-low);
      border-color: var(--lv-low);
      color: #fff;
      box-shadow: 0 2px 6px rgba(217, 119, 6, 0.25);
    }

    .lv-btn.active-poor {
      background: var(--lv-poor);
      border-color: var(--lv-poor);
      color: #fff;
      box-shadow: 0 2px 6px rgba(220, 38, 38, 0.25);
    }

    /* Tags Section inside Card */
    .tags-box {
      padding: 10px 16px 14px 16px;
      background: #fafbfc;
      border-top: 1px solid var(--border);
    }

    .tags-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--ink-muted);
      margin-bottom: 8px;
      display: block;
    }

    .tags-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .tag-chip {
      padding: 6px 11px;
      min-height: 32px;
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid var(--border-strong);
      background: #fff;
      color: var(--ink-muted);
      transition: all 0.12s;
      user-select: none;
    }

    .tag-chip:hover {
      border-color: #94a3b8;
    }

    .tag-chip.pos.selected {
      background: var(--tag-pos-bg);
      border-color: var(--tag-pos);
      color: var(--tag-pos);
    }

    .tag-chip.imp.selected {
      background: var(--tag-imp-bg);
      border-color: var(--tag-imp);
      color: var(--tag-imp);
    }

    /* Remarks Card */
    .remarks-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
    }

    .remarks-card label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 14px;
      font-weight: 700;
      color: var(--ink);
      margin-bottom: 8px;
    }

    .remarks-card label span {
      font-size: 12px;
      font-weight: 500;
      color: var(--ink-muted);
    }

    .remarks-textarea {
      width: 100%;
      min-height: 74px;
      padding: 10px 12px;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm);
      font-size: 14px;
      color: var(--ink);
      resize: vertical;
      background: var(--surface-soft);
    }

    .remarks-textarea:focus {
      outline: none;
      border-color: var(--accent-4a);
      background: #fff;
    }

    /* Bottom Student Footer */
    .bottom-nav-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }

    /* Modals */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.5);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 60;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-card {
      background: #fff;
      border-radius: var(--radius);
      max-width: 520px;
      width: 100%;
      padding: 20px;
      box-shadow: var(--shadow-md);
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-card h3 {
      margin: 0 0 8px 0;
      font-size: 17px;
      color: var(--ink);
    }

    .modal-card p {
      margin: 0 0 12px 0;
      font-size: 13px;
      color: var(--ink-muted);
    }

    .modal-textarea {
      width: 100%;
      min-height: 160px;
      padding: 10px 12px;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm);
      font-size: 14px;
      margin-bottom: 12px;
    }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #0f172a;
      color: #fff;
      padding: 10px 16px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 600;
      box-shadow: var(--shadow-md);
      opacity: 0;
      transform: translateY(12px);
      pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
      z-index: 80;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* Sidebar overlay for mobile/tablet */
    .sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.4);
      z-index: 25;
    }

    @media (max-width: 960px) {
      .sidebar {
        position: fixed;
        left: 0;
        top: 0;
        transform: translateX(-100%);
        transition: transform 0.22s ease;
        box-shadow: var(--shadow-md);
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .sidebar-overlay.open {
        display: block;
      }

      .btn.mobile-menu-btn {
        display: inline-flex;
      }

      .top-bar {
        padding: 10px 12px;
      }

      .grading-container {
        padding: 14px 12px 64px 12px;
      }

      .lv-btn {
        min-width: 56px;
        padding: 6px 6px;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <div id="sidebarOverlay" class="sidebar-overlay"></div>

    <!-- Left Roster Sidebar -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <div class="brand-title">
          <span>DAE 中期報告評分</span>
          <button id="closeSidebarBtn" class="btn btn-sm mobile-menu-btn" type="button" aria-label="關閉名單">✕</button>
        </div>
        <p class="brand-sub">4A 文字 (15%) ＋ 4B 口頭 (10%)</p>
        <div class="class-input-row">
          <input id="classNameInput" class="class-input" type="text" placeholder="班別名稱（如 Class 4）" />
        </div>
      </div>

      <div class="sidebar-actions">
        <button id="openImportModalBtn" class="btn btn-primary btn-sm" type="button" style="flex:1;">批次貼上名單</button>
        <button id="addStudentBtn" class="btn btn-sm" type="button">＋ 新增</button>
      </div>

      <div class="search-box">
        <input id="rosterSearchInput" type="text" placeholder="搜尋學生姓名..." />
      </div>

      <div id="rosterList" class="roster-list"></div>

      <div class="sidebar-footer">
        <span id="progressSummary">已完成 0 / 1 人</span>
        <span id="saveStatusText">已自動暫存</span>
      </div>
    </aside>

    <!-- Main Scrollable Area -->
    <main class="main-area">
      <!-- Sticky Top Bar -->
      <header class="top-bar">
        <div class="top-student-nav">

    const ALL_SUBITEM_COUNT_4A = RUBRIC['4a'].categories.reduce((acc, c) => acc + c.subitems.length, 0);
    const ALL_SUBITEM_COUNT_4B = RUBRIC['4b'].categories.reduce((acc, c) => acc + c.subitems.length, 0);

    function uid() {
      return 'stu_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 7);
    }

    function createStudent(name) {
      return {
        id: uid(),
        name: name || '新學生',
        ratings: {},   // subitemId -> 'high'|'mid'|'low'|'poor'
        adj: {},       // catId -> number (e.g. -0.5, +0.5)
        tags: [],      // array of tagIds
        remarks4a: '',
        remarks4b: ''
      };
    }

    let state = {
      className: 'DAE 生涯規劃',
      activeStudentId: null,
      students: []
    };

    let searchQuery = '';
    let pendingConfirmAction = null;
    let toastTimer = null;

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && Array.isArray(parsed.students) && parsed.students.length > 0) {
            state = parsed;
            if (!state.students.some(s => s.id === state.activeStudentId)) {
              state.activeStudentId = state.students[0].id;
            }
            return;
          }
        }
      } catch (e) {
        // Fallback when localStorage is unavailable
      }
      const initial = createStudent('學生 1（可改名或匯入名單）');
      state = {
        className: 'DAE 生涯規劃',
        activeStudentId: initial.id,
        students: [initial]
      };
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        const el = document.getElementById('saveStatusText');
        if (el) {
          const now = new Date();
          const hh = String(now.getHours()).padStart(2, '0');
          const mm = String(now.getMinutes()).padStart(2, '0');
          el.textContent = '已暫存 ' + hh + ':' + mm;
        }
      } catch (e) {
        const el = document.getElementById('saveStatusText');
        if (el) el.textContent = '請記得匯出存檔';
      }
    }

    function showToast(msg) {
      const el = document.getElementById('toast');
      if (!el) return;
      el.textContent = msg;
      el.classList.add('show');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('show'), 2400);
    }

    function getActiveStudent() {
      return state.students.find(s => s.id === state.activeStudentId) || state.students[0];
    }

    function getLevelScore(lvKey) {
      const found = LEVELS.find(l => l.key === lvKey);
      return found ? found.score : null;
    }

    function getLevelLabel(lvKey) {
      const found = LEVELS.find(l => l.key === lvKey);
      return found ? found.label : '未評';
    }

    function calcCategory(student, cat) {
      let sum = 0;
      let count = 0;
      for (const sub of cat.subitems) {
        const sc = getLevelScore(student.ratings[sub.id]);
        if (sc !== null) {
          sum += sc;
          count++;
        }
      }
      const adj = typeof student.adj[cat.id] === 'number' ? student.adj[cat.id] : 0;
      if (count === 0) {
        return { count: 0, totalSubs: cat.subitems.length, rawAvg: null, adj, final10: null, weighted: 0 };
      }
      const rawAvg = sum / count;
      const final10 = Math.max(0, Math.min(10, Math.round((rawAvg + adj) * 100) / 100));
      const weighted = Math.round(final10 * cat.weight * 100) / 100;
      return { count, totalSubs: cat.subitems.length, rawAvg, adj, final10, weighted };
    }

    function calcStudentScores(student) {
      let total4a = 0;
      let rated4a = 0;
      const cats4a = {};
      for (const cat of RUBRIC['4a'].categories) {
        const res = calcCategory(student, cat);
        cats4a[cat.id] = res;
        total4a += res.weighted;
        rated4a += res.count;
      }

      let total4b = 0;
      let rated4b = 0;
      const cats4b = {};
      for (const cat of RUBRIC['4b'].categories) {
        const res = calcCategory(student, cat);
        cats4b[cat.id] = res;
        total4b += res.weighted;
        rated4b += res.count;
      }

      total4a = Math.round(total4a * 100) / 100;
      total4b = Math.round(total4b * 100) / 100;
      const grandTotal = Math.round((total4a + total4b) * 100) / 100;

      const totalSubs = ALL_SUBITEM_COUNT_4A + ALL_SUBITEM_COUNT_4B;
      const totalRated = rated4a + rated4b;
      const status = totalRated === 0 ? 'empty' : (totalRated === totalSubs ? 'done' : 'partial');

      return { total4a, rated4a, cats4a, total4b, rated4b, cats4b, grandTotal, totalRated, totalSubs, status };
    }

    function fmtNum(val) {
      if (val === null || val === undefined || Number.isNaN(val)) return '--';
      return Number(val).toFixed(2).replace(/\.00$/, '.0');
    }

    function fmtScore(val) {
      if (val === null || val === undefined || Number.isNaN(val)) return '--';
      const fixed = Number(val).toFixed(2);
      return fixed.endsWith('0') ? Number(val).toFixed(1) : fixed;
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function renderRoster() {
      const listEl = document.getElementById('rosterList');
      const filtered = state.students.filter(s =>
        !searchQuery || s.name.toLowerCase().includes(searchQuery.toLowerCase())
      );

      let doneCount = 0;
      for (const s of state.students) {
        if (calcStudentScores(s).status === 'done') doneCount++;
      }
      document.getElementById('progressSummary').textContent = `已完成 ${doneCount} / ${state.students.length} 人`;
      document.getElementById('classNameInput').value = state.className || '';

      listEl.innerHTML = filtered.map((s) => {
        const sc = calcStudentScores(s);
        const isActive = s.id === state.activeStudentId;
        const dotClass = sc.status === 'done' ? 'done' : (sc.status === 'partial' ? 'partial' : '');
        const scoreLabel = sc.totalRated > 0 ? `${fmtScore(sc.grandTotal)}/25` : '未評';
        return `
          <div class="student-item ${isActive ? 'active' : ''}" data-student-id="${s.id}">
            <div class="student-item-left">
              <span class="status-dot ${dotClass}"></span>
              <span class="student-item-name">${escapeHtml(s.name)}</span>
            </div>
            <span class="student-item-score">${scoreLabel}</span>
          </div>
        `;
      }).join('');
    }

    function renderTopBar() {
      const stu = getActiveStudent();
      const sc = calcStudentScores(stu);
      const idx = state.students.findIndex(s => s.id === stu.id);

      const nameInput = document.getElementById('studentNameInput');
      if (document.activeElement !== nameInput) {
        nameInput.value = stu.name;
      }

      document.getElementById('prevStudentBtn').disabled = idx <= 0;
      document.getElementById('nextStudentBtn').disabled = idx >= state.students.length - 1;
      document.getElementById('topScore4a').textContent = `${fmtScore(sc.total4a)} / 15`;
      document.getElementById('topScore4b').textContent = `${fmtScore(sc.total4b)} / 10`;
      document.getElementById('topScoreTotal').textContent = `${fmtScore(sc.grandTotal)} / 25`;
    }

    function renderSectionHtml(partKey, student, scores) {
      const part = RUBRIC[partKey];
      const is4b = partKey === '4b';
      const ratedCount = is4b ? scores.rated4b : scores.rated4a;
      const totalSubCount = is4b ? ALL_SUBITEM_COUNT_4B : ALL_SUBITEM_COUNT_4A;
      const partTotal = is4b ? scores.total4b : scores.total4a;
      const catScoresMap = is4b ? scores.cats4b : scores.cats4a;
      const remarksVal = is4b ? student.remarks4b : student.remarks4a;

      const cardsHtml = part.categories.map(cat => {
        const cScore = catScoresMap[cat.id];
        const rawText = cScore.rawAvg === null
          ? '尚未點選細項'
          : `細項均分 ${fmtScore(cScore.rawAvg)}${cScore.adj !== 0 ? ` (${cScore.adj > 0 ? '+' : ''}${cScore.adj})` : ''}`;
        const finalText = cScore.final10 === null ? '--' : fmtScore(cScore.final10);
        const weightedText = cScore.final10 === null ? `-- / ${cat.maxScore}` : `${fmtScore(cScore.weighted)} / ${cat.maxScore}`;

        const subitemsHtml = cat.subitems.map(sub => {
          const currentLv = student.ratings[sub.id] || null;
          const btnsHtml = LEVELS.map(lv => {
            const activeCls = currentLv === lv.key ? lv.cls : '';
            return `
              <button type="button"
                class="lv-btn ${activeCls}"
                data-action="rate"
                data-sub-id="${sub.id}"
                data-level="${lv.key}">
                <span>${lv.label}</span>
                <small>${lv.score}分</small>
              </button>
            `;
          }).join('');

          return `
            <div class="subitem-row">
              <div class="subitem-info">
                <p class="subitem-name">${escapeHtml(sub.name)}</p>
                <p class="subitem-hint">${escapeHtml(sub.hint)}</p>
              </div>
              <div class="level-buttons">${btnsHtml}</div>
            </div>
          `;
        }).join('');

        const tagsHtml = cat.tags.map(tag => {
          const isSel = student.tags.includes(tag.id);
          const prefix = tag.type === 'pos' ? '＋ ' : '△ ';
          return `
            <button type="button"
              class="tag-chip ${tag.type} ${isSel ? 'selected' : ''}"
              data-action="toggle-tag"
              data-tag-id="${tag.id}">
              ${prefix}${escapeHtml(tag.label)}
            </button>
          `;
        }).join('');

        return `
          <section class="cat-card ${is4b ? 'card-4b' : ''}">
            <div class="cat-header">
              <div class="cat-title-wrap">
                <h3 class="cat-title">${escapeHtml(cat.name)}</h3>
                <span class="cat-weight">× ${cat.weight}（滿分 ${cat.maxScore}）</span>
              </div>
              <div class="cat-score-controls">
                <span class="cat-raw-info">${rawText}</span>
                <div class="adj-group" title="按全班相對表現微調此範疇得分（滿分 10）">
                  <button type="button" class="adj-btn" data-action="adj" data-cat-id="${cat.id}" data-delta="-0.5">-0.5</button>
                  <span class="adj-val">${finalText}</span>
                  <button type="button" class="adj-btn" data-action="adj" data-cat-id="${cat.id}" data-delta="0.5">+0.5</button>
                </div>
                <span class="cat-weighted-badge">${weightedText}</span>
              </div>
            </div>
            <div class="subitem-list">${subitemsHtml}</div>
            <div class="tags-box">
              <span class="tags-label">重點標籤（點選留底，供日後潤飾 2–3 句評語）：</span>
              <div class="tags-wrap">${tagsHtml}</div>
            </div>
          </section>
        `;
      }).join('');

      return `
        <div id="section-${partKey}" class="section-banner banner-${partKey}">
          <h2>${escapeHtml(part.title)}</h2>
          <div class="section-banner-meta">
            <span class="banner-badge">已評 ${ratedCount} / ${totalSubCount} 細項</span>
            <span class="banner-badge">實得 ${fmtScore(partTotal)} / ${part.maxTotal}</span>
          </div>
        </div>
        ${cardsHtml}
        <div class="remarks-card">
          <label for="remarks-${partKey}">
            ${escapeHtml(part.remarksLabel)}
            <span>關鍵字即可，毋須寫完整句子</span>
          </label>
          <textarea
            id="remarks-${partKey}"
            class="remarks-textarea"
            data-remarks-part="${partKey}"
            placeholder="${escapeHtml(part.remarksPlaceholder)}">${escapeHtml(remarksVal)}</textarea>
        </div>
      `;
    }

    function renderGradingBody() {
      const stu = getActiveStudent();
      const sc = calcStudentScores(stu);
      const container = document.getElementById('gradingContainer');
      const idx = state.students.findIndex(s => s.id === stu.id);

      container.innerHTML = `
        ${renderSectionHtml('4a', stu, sc)}
        ${renderSectionHtml('4b', stu, sc)}
        <div class="bottom-nav-bar">
          <div style="display:flex; gap:8px; flex-wrap:wrap;">
            <button type="button" class="btn btn-danger-ghost btn-sm" data-action="reset-student">清空此生分數</button>
            <button type="button" class="btn btn-danger-ghost btn-sm" data-action="delete-student" ${state.students.length <= 1 ? 'disabled' : ''}>刪除此生</button>
          </div>
          <div style="display:flex; gap:8px; flex-wrap:wrap;">
            <button type="button" class="btn" data-action="go-prev" ${idx <= 0 ? 'disabled' : ''}>‹ 上一位同學</button>
            <button type="button" class="btn btn-primary" data-action="go-next" ${idx >= state.students.length - 1 ? 'disabled' : ''}>下一位同學 ›</button>
          </div>
        </div>
      `;
    }

    function renderAll() {
      renderRoster();
      renderTopBar();
      renderGradingBody();
    }

    function updateScoresOnlyAndSyncUI() {
      renderRoster();
      renderTopBar();
      // Preserve scroll position when re-rendering body
      const scrollY = window.scrollY;
      renderGradingBody();
      window.scrollTo(0, scrollY);
    }

    function selectStudent(id) {
      if (!state.students.some(s => s.id === id)) return;
      state.activeStudentId = id;
      saveState();
      renderAll();
      window.scrollTo({ top: 0, behavior: 'smooth' });
      closeSidebar();
    }

    function stepStudent(delta) {
      const idx = state.students.findIndex(s => s.id === state.activeStudentId);
      const nextIdx = idx + delta;
      if (nextIdx >= 0 && nextIdx < state.students.length) {
        selectStudent(state.students[nextIdx].id);
      }
    }

    function getTagDetails(tagIds, partKey) {
      const pos = [];
      const imp = [];
      for (const cat of RUBRIC[partKey].categories) {
        for (const t of cat.tags) {
          if (tagIds.includes(t.id)) {
            if (t.type === 'pos') pos.push(t.label);
            else imp.push(t.label);
          }
        }
      }
      return { pos, imp };
    }

    function buildStudentMarkdown(stu) {
      const sc = calcStudentScores(stu);
      const tags4a = getTagDetails(stu.tags, '4a');
      const tags4b = getTagDetails(stu.tags, '4b');

      const lines = [];
      lines.push(`## ${stu.name}（總分：${fmtScore(sc.grandTotal)} / 25｜4A：${fmtScore(sc.total4a)} / 15｜4B：${fmtScore(sc.total4b)} / 10）`);
      lines.push('');

      lines.push('### 評量表 4A — 文字報告（15%）');
      for (const cat of RUBRIC['4a'].categories) {
        const cs = sc.cats4a[cat.id];
        const subParts = cat.subitems.map(sub => `${sub.name.replace(/^\d+\.\s*/, '')}：${getLevelLabel(stu.ratings[sub.id])}`).join('；');
        const adjStr = cs.adj !== 0 ? `（微調 ${cs.adj > 0 ? '+' : ''}${cs.adj}）` : '';
        lines.push(`- **${cat.name}**（×${cat.weight}）：**${cs.final10 === null ? '未評' : fmtScore(cs.final10) + ' / 10'}**${adjStr} → 實得 **${cs.final10 === null ? '--' : fmtScore(cs.weighted)} / ${cat.maxScore}**（${subParts}）`);
      }
      lines.push(`- **4A 亮點標籤**：${tags4a.pos.length ? tags4a.pos.join('、') : '（無）'}`);
      lines.push(`- **4A 建議標籤**：${tags4a.imp.length ? tags4a.imp.join('、') : '（無）'}`);
      lines.push(`- **4A 關鍵字 Remarks**：${stu.remarks4a.trim() || '（無）'}`);
      lines.push('');

      lines.push('### 評量表 4B — 口頭報告（10%）');
      for (const cat of RUBRIC['4b'].categories) {
        const cs = sc.cats4b[cat.id];
        const subParts = cat.subitems.map(sub => `${sub.name.replace(/^\d+\.\s*/, '')}：${getLevelLabel(stu.ratings[sub.id])}`).join('；');
        const adjStr = cs.adj !== 0 ? `（微調 ${cs.adj > 0 ? '+' : ''}${cs.adj}）` : '';
        lines.push(`- **${cat.name}**（×${cat.weight}）：**${cs.final10 === null ? '未評' : fmtScore(cs.final10) + ' / 10'}**${adjStr} → 實得 **${cs.final10 === null ? '--' : fmtScore(cs.weighted)} / ${cat.maxScore}**（${subParts}）`);
      }
      lines.push(`- **4B 亮點標籤**：${tags4b.pos.length ? tags4b.pos.join('、') : '（無）'}`);
      lines.push(`- **4B 建議標籤**：${tags4b.imp.length ? tags4b.imp.join('、') : '（無）'}`);
      lines.push(`- **4B 關鍵字 Remarks**：${stu.remarks4b.trim() || '（無）'}`);
      lines.push('');
      return lines.join('\n');
    }

    function buildFullMarkdown() {
      const cls = state.className || 'DAE 生涯規劃';
      const today = new Date().toISOString().slice(0, 10);
      const lines = [
        '---',
        'tags:',
        '  - psy',
        '  - dae-midterm',
        '---',
        `# ${cls} — 中期報告評分總表（${today}）`,
        '',
        '## 全班分數總覽',
        '',
        '| 學生 | 4A 個人經歷 (/5) | 4A 生涯圖像 (/4) | 4A 生涯動力 (/3) | 4A 表達技能 (/3) | **4A 總分 (/15)** | 4B 個人經歷 (/3) | 4B 表達技能 (/2) | 4B 表達技巧 (/5) | **4B 總分 (/10)** | **總分 (/25)** |',
        '|---|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|'
      ];

      for (const stu of state.students) {
        const sc = calcStudentScores(stu);
        const c4a = sc.cats4a;
        const c4b = sc.cats4b;
        const cell = (obj) => obj.final10 === null ? '--' : fmtScore(obj.weighted);
        lines.push(`| ${stu.name} | ${cell(c4a['4a_exp'])} | ${cell(c4a['4a_vis'])} | ${cell(c4a['4a_mot'])} | ${cell(c4a['4a_exp_skill'])} | **${fmtScore(sc.total4a)}** | ${cell(c4b['4b_exp'])} | ${cell(c4b['4b_skill'])} | ${cell(c4b['4b_tech'])} | **${fmtScore(sc.total4b)}** | **${fmtScore(sc.grandTotal)}** |`);
      }

      lines.push('');
      lines.push('## 個別學生細項檢核與評語依據');
      lines.push('');
      for (const stu of state.students) {
        lines.push(buildStudentMarkdown(stu));
      }
      return lines.join('\n');
    }

    function buildCsv() {
      const headers = [
        '學生姓名',
        '4A_個人經歷(10分制)', '4A_個人經歷(×0.5)',
        '4A_生涯圖像(10分制)', '4A_生涯圖像(×0.4)',
        '4A_生涯動力(10分制)', '4A_生涯動力(×0.3)',
        '4A_表達技能(10分制)', '4A_表達技能(×0.3)',
        '4A_總分(/15)', '4A_亮點標籤', '4A_建議標籤', '4A_Remarks',
        '4B_個人經歷(10分制)', '4B_個人經歷(×0.3)',
        '4B_表達技能(10分制)', '4B_表達技能(×0.2)',
        '4B_表達技巧(10分制)', '4B_表達技巧(×0.5)',
        '4B_總分(/10)', '4B_亮點標籤', '4B_建議標籤', '4B_Remarks',
        '總分(/25)'
      ];

      const escCsv = (val) => {
        const s = String(val === null || val === undefined ? '' : val);
        return `"${s.replace(/"/g, '""')}"`;
      };

      const rows = [headers.map(escCsv).join(',')];
      for (const stu of state.students) {
        const sc = calcStudentScores(stu);
        const t4a = getTagDetails(stu.tags, '4a');
        const t4b = getTagDetails(stu.tags, '4b');
        const v10 = (o) => o.final10 === null ? '' : fmtScore(o.final10);
        const vw = (o) => o.final10 === null ? '' : fmtScore(o.weighted);
        const row = [
          stu.name,
          v10(sc.cats4a['4a_exp']), vw(sc.cats4a['4a_exp']),
          v10(sc.cats4a['4a_vis']), vw(sc.cats4a['4a_vis']),
          v10(sc.cats4a['4a_mot']), vw(sc.cats4a['4a_mot']),
          v10(sc.cats4a['4a_exp_skill']), vw(sc.cats4a['4a_exp_skill']),
          fmtScore(sc.total4a), t4a.pos.join('、'), t4a.imp.join('、'), stu.remarks4a,
          v10(sc.cats4b['4b_exp']), vw(sc.cats4b['4b_exp']),
          v10(sc.cats4b['4b_skill']), vw(sc.cats4b['4b_skill']),
          v10(sc.cats4b['4b_tech']), vw(sc.cats4b['4b_tech']),
          fmtScore(sc.total4b), t4b.pos.join('、'), t4b.imp.join('、'), stu.remarks4b,
          fmtScore(sc.grandTotal)
        ];
        rows.push(row.map(escCsv).join(','));
      }
      return '\uFEFF' + rows.join('\r\n');
    }

    function downloadFile(filename, content, mimeType) {
      const blob = new Blob([content], { type: mimeType });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function copyText(text, successMsg) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => showToast(successMsg)).catch(() => fallbackCopy(text, successMsg));
      } else {
        fallbackCopy(text, successMsg);
      }
    }

    function fallbackCopy(text, successMsg) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand('copy');
        showToast(successMsg);
      } catch (e) {
        showToast('無法複製，請改用匯出 MD');
      }
      document.body.removeChild(ta);
    }

    function openConfirm(title, message, onConfirm) {
      document.getElementById('confirmTitle').textContent = title;
      document.getElementById('confirmMessage').textContent = message;
      pendingConfirmAction = onConfirm;
      document.getElementById('confirmModal').classList.add('open');
    }

    function closeConfirm() {
      pendingConfirmAction = null;
      document.getElementById('confirmModal').classList.remove('open');
    }

    function openSidebar() {
      document.getElementById('sidebar').classList.add('open');
      document.getElementById('sidebarOverlay').classList.add('open');
    }

    function closeSidebar() {
      document.getElementById('sidebar').classList.remove('open');
      document.getElementById('sidebarOverlay').classList.remove('open');
    }

    function importRosterNames(mode) {
      const raw = document.getElementById('rosterPasteInput').value;
      const names = raw.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
      if (names.length === 0) {
        showToast('請先輸入或貼上至少一位學生姓名');
        return;
      }
      const newStudents = names.map(n => createStudent(n));
      if (mode === 'replace') {
        state.students = newStudents;
        state.activeStudentId = newStudents[0].id;
      } else {
        state.students.push(...newStudents);
        state.activeStudentId = newStudents[0].id;
      }
      saveState();
      renderAll();
      document.getElementById('rosterPasteInput').value = '';
      document.getElementById('importModal').classList.remove('open');
      showToast(`已匯入 ${newStudents.length} 位學生`);
    }

    function bindEvents() {
      // Roster click
      document.getElementById('rosterList').addEventListener('click', (e) => {
        const item = e.target.closest('.student-item');
        if (item) selectStudent(item.dataset.studentId);
      });

      // Class name edit
      document.getElementById('classNameInput').addEventListener('input', (e) => {
        state.className = e.target.value;
        saveState();
      });

      // Search roster
      document.getElementById('rosterSearchInput').addEventListener('input', (e) => {
        searchQuery = e.target.value;
        renderRoster();
      });

      // Add single student
      document.getElementById('addStudentBtn').addEventListener('click', () => {
        const stu = createStudent(`學生 ${state.students.length + 1}`);
        state.students.push(stu);
        state.activeStudentId = stu.id;
        saveState();
        renderAll();
        showToast('已新增學生');
      });

      // Edit active student name
      document.getElementById('studentNameInput').addEventListener('input', (e) => {
        const stu = getActiveStudent();
        stu.name = e.target.value;
        saveState();
        renderRoster();
      });

      // Prev / Next student
      document.getElementById('prevStudentBtn').addEventListener('click', () => stepStudent(-1));
      document.getElementById('nextStudentBtn').addEventListener('click', () => stepStudent(1));

      // Jump anchors
      document.getElementById('jump4aBtn').addEventListener('click', () => {
        const el = document.getElementById('section-4a');
        if (el) el.scrollIntoView({ behavior: 'smooth' });
      });
      document.getElementById('jump4bBtn').addEventListener('click', () => {
        const el = document.getElementById('section-4b');
        if (el) el.scrollIntoView({ behavior: 'smooth' });
      });

      // Mobile sidebar toggle
      document.getElementById('openSidebarBtn').addEventListener('click', openSidebar);
      document.getElementById('closeSidebarBtn').addEventListener('click', closeSidebar);
      document.getElementById('sidebarOverlay').addEventListener('click', closeSidebar);

      // Grading container delegated clicks
      document.getElementById('gradingContainer').addEventListener('click', (e) => {
        const btn = e.target.closest('[data-action]');
        if (!btn) return;
        const action = btn.dataset.action;
        const stu = getActiveStudent();

        if (action === 'rate') {
          const subId = btn.dataset.subId;
          const level = btn.dataset.level;
          if (stu.ratings[subId] === level) {
            delete stu.ratings[subId];
          } else {
            stu.ratings[subId] = level;
          }
          saveState();
          updateScoresOnlyAndSyncUI();
        } else if (action === 'adj') {
          const catId = btn.dataset.catId;
          const delta = parseFloat(btn.dataset.delta);
          const cur = typeof stu.adj[catId] === 'number' ? stu.adj[catId] : 0;
          stu.adj[catId] = Math.round((cur + delta) * 10) / 10;
          saveState();
          updateScoresOnlyAndSyncUI();
        } else if (action === 'toggle-tag') {
          const tagId = btn.dataset.tagId;
          const idx = stu.tags.indexOf(tagId);
          if (idx >= 0) stu.tags.splice(idx, 1);
          else stu.tags.push(tagId);
          saveState();
          btn.classList.toggle('selected');
        } else if (action === 'reset-student') {
          openConfirm('清空此生分數與標籤', `確定要清空「${stu.name}」所有已點選的細項分數、標籤和 Remarks 嗎？`, () => {
            stu.ratings = {};
            stu.adj = {};
            stu.tags = [];
            stu.remarks4a = '';
            stu.remarks4b = '';
            saveState();
            renderAll();
            showToast('已清空此生評分');
          });
        } else if (action === 'delete-student') {
          if (state.students.length <= 1) return;
          openConfirm('刪除學生', `確定要從名單中刪除「${stu.name}」嗎？此操作無法復原。`, () => {
            const idx = state.students.findIndex(s => s.id === stu.id);
            state.students.splice(idx, 1);
            state.activeStudentId = state.students[Math.max(0, idx - 1)].id;
            saveState();
            renderAll();
            showToast('已刪除學生');
          });
        } else if (action === 'go-prev') {
          stepStudent(-1);
        } else if (action === 'go-next') {
          stepStudent(1);
        }
      });

      // Remarks textarea input (delegated)
      document.getElementById('gradingContainer').addEventListener('input', (e) => {
        const ta = e.target.closest('textarea[data-remarks-part]');
        if (!ta) return;
        const stu = getActiveStudent();
        if (ta.dataset.remarksPart === '4a') stu.remarks4a = ta.value;
        else stu.remarks4b = ta.value;
        saveState();
      });

      // Import roster modal
      document.getElementById('openImportModalBtn').addEventListener('click', () => {
        document.getElementById('importModal').classList.add('open');
        document.getElementById('rosterPasteInput').focus();
      });
      document.getElementById('cancelImportBtn').addEventListener('click', () => {
        document.getElementById('importModal').classList.remove('open');
      });
      document.getElementById('appendRosterBtn').addEventListener('click', () => importRosterNames('append'));
      document.getElementById('replaceRosterBtn').addEventListener('click', () => importRosterNames('replace'));

      // Confirm modal
      document.getElementById('confirmCancelBtn').addEventListener('click', closeConfirm);
      document.getElementById('confirmOkBtn').addEventListener('click', () => {
        const fn = pendingConfirmAction;
        closeConfirm();
        if (fn) fn();
      });

      // Copy current student summary
      document.getElementById('copyOneBtn').addEventListener('click', () => {
        const stu = getActiveStudent();
        copyText(buildStudentMarkdown(stu), `已複製「${stu.name}」評分摘要`);
      });

      // Export Markdown
      document.getElementById('exportMdBtn').addEventListener('click', () => {
        const safeName = (state.className || 'DAE_中期報告').replace(/[\\/:*?"<>|]/g, '_');
        const dateStr = new Date().toISOString().slice(0, 10);
        downloadFile(`${safeName}_中期報告評分總表_${dateStr}.md`, buildFullMarkdown(), 'text/markdown;charset=utf-8');
        showToast('已匯出 Markdown 總表');
      });

      // Export CSV
      document.getElementById('exportCsvBtn').addEventListener('click', () => {
        const safeName = (state.className || 'DAE_中期報告').replace(/[\\/:*?"<>|]/g, '_');
        const dateStr = new Date().toISOString().slice(0, 10);
        downloadFile(`${safeName}_中期報告分數_${dateStr}.csv`, buildCsv(), 'text/csv;charset=utf-8');
        showToast('已匯出 CSV 成績檔');
      });

      // Export JSON backup
      document.getElementById('exportJsonBtn').addEventListener('click', () => {
        const safeName = (state.className || 'DAE_中期報告').replace(/[\\/:*?"<>|]/g, '_');
        const dateStr = new Date().toISOString().slice(0, 10);
        downloadFile(`${safeName}_評分進度檔_${dateStr}.json`, JSON.stringify(state, null, 2), 'application/json;charset=utf-8');
        showToast('已匯出進度檔（可用於跨裝置同步）');
      });

      // Import JSON backup
      document.getElementById('importJsonBtn').addEventListener('click', () => {
        document.getElementById('jsonFileInput').click();
      });
      document.getElementById('jsonFileInput').addEventListener('change', (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const parsed = JSON.parse(String(reader.result || ''));
            if (!parsed || !Array.isArray(parsed.students) || parsed.students.length === 0) {
              showToast('進度檔格式不正確');
              return;
            }
            state = parsed;
            if (!state.students.some(s => s.id === state.activeStudentId)) {
              state.activeStudentId = state.students[0].id;
            }
            saveState();
            renderAll();
            showToast(`已讀取進度（共 ${state.students.length} 位學生）`);
          } catch (err) {
            showToast('讀取失敗，請確認檔案為有效 JSON');
          }
        };
        reader.readAsText(file);
        e.target.value = '';
      });
    }

    loadState();
    bindEvents();
    renderAll();
  </script>
</body>
</html>
